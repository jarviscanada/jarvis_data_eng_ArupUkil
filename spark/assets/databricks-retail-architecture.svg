<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#4b5563"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .text { font: 14px Arial, sans-serif; fill: #1f2937; }
      .small { font: 12px Arial, sans-serif; fill: #374151; }
      .group { fill: #fafafa; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #374151; stroke-width: 1.8; rx: 12; ry: 12; }
      .store { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; rx: 12; ry: 12; }
      .compute { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; rx: 12; ry: 12; }
      .result { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 12; ry: 12; }
      .line { stroke: #4b5563; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="620" class="bg"/>
  <text x="40" y="40" class="title">Databricks Retail Analytics Architecture</text>

  <rect x="30" y="70" width="920" height="200" rx="26" ry="26" class="group"/>
  <text x="55" y="100" class="label">Retail Source Environment</text>

  <rect x="70" y="125" width="170" height="70" class="box"/>
  <text x="155" y="155" text-anchor="middle" class="label">LGS Web App</text>
  <text x="155" y="176" text-anchor="middle" class="text">Orders, customer, and</text>
  <text x="155" y="194" text-anchor="middle" class="text">transaction events</text>

  <rect x="300" y="122" width="190" height="78" class="store"/>
  <text x="395" y="154" text-anchor="middle" class="label">Retail OLTP / OTAP</text>
  <text x="395" y="178" text-anchor="middle" class="text">Operational DB</text>

  <rect x="580" y="115" width="135" height="55" class="box"/>
  <text x="648" y="149" text-anchor="middle" class="label">retail.sql</text>

  <rect x="580" y="185" width="135" height="55" class="box"/>
  <text x="648" y="219" text-anchor="middle" class="label">retail.csv</text>

  <line x1="240" y1="160" x2="300" y2="160" class="line"/>
  <line x1="490" y1="145" x2="580" y2="142" class="line"/>
  <line x1="490" y1="182" x2="580" y2="212" class="line"/>
  <rect x="510" y="120" width="52" height="18" fill="#ffffff"/>
  <text x="536" y="133" text-anchor="middle" class="small">export</text>
  <rect x="512" y="197" width="44" height="18" fill="#ffffff"/>
  <text x="534" y="210" text-anchor="middle" class="small">dump</text>

  <rect x="160" y="320" width="660" height="250" rx="28" ry="28" class="group"/>
  <text x="185" y="350" class="label">Azure Databricks Workspace</text>

  <rect x="210" y="400" width="160" height="70" class="compute"/>
  <text x="290" y="430" text-anchor="middle" class="label">Compute Cluster</text>
  <text x="290" y="454" text-anchor="middle" class="text">Spark runtime</text>

  <rect x="420" y="385" width="210" height="100" class="compute"/>
  <text x="525" y="420" text-anchor="middle" class="label">Retail Data Analytics</text>
  <text x="525" y="444" text-anchor="middle" class="label">Notebook</text>
  <text x="525" y="468" text-anchor="middle" class="text">PySpark DataFrames</text>

  <rect x="690" y="385" width="90" height="100" class="store"/>
  <text x="735" y="423" text-anchor="middle" class="label">Hive</text>
  <text x="735" y="445" text-anchor="middle" class="label">Metastore</text>
  <text x="735" y="468" text-anchor="middle" class="small">retail_csv</text>

  <rect x="450" y="510" width="155" height="42" class="result"/>
  <text x="528" y="537" text-anchor="middle" class="label">Analytics Outputs</text>

  <line x1="370" y1="435" x2="420" y2="435" class="line"/>
  <line x1="630" y1="435" x2="690" y2="435" class="line"/>
  <line x1="525" y1="485" x2="525" y2="510" class="line"/>
  <rect x="358" y="403" width="76" height="18" fill="#ffffff"/>
  <text x="396" y="416" text-anchor="middle" class="small">run notebook</text>
  <rect x="618" y="403" width="86" height="31" fill="#ffffff"/>
  <text x="661" y="416" text-anchor="middle" class="small">save curated</text>
  <text x="661" y="429" text-anchor="middle" class="small">table</text>
  <rect x="532" y="492" width="56" height="18" fill="#ffffff"/>
  <text x="560" y="505" text-anchor="middle" class="small">display()</text>

  <line x1="620" y1="240" x2="500" y2="385" class="line"/>
  <path d="M715 142 L800 142 L800 365 L750 365 L750 385" class="line"/>
  <rect x="508" y="280" width="92" height="32" fill="#ffffff"/>
  <text x="554" y="293" text-anchor="middle" class="small">upload to</text>
  <text x="554" y="307" text-anchor="middle" class="small">volume / DBFS</text>
  <rect x="772" y="246" width="84" height="18" fill="#ffffff"/>
  <text x="814" y="259" text-anchor="middle" class="small">load to table</text>

  <line x1="395" y1="200" x2="395" y2="385" class="line"/>
  <rect x="410" y="290" width="100" height="18" fill="#ffffff"/>
  <text x="460" y="303" text-anchor="middle" class="small">JDBC or spark.table</text>
</svg>
