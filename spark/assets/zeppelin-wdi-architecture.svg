<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#4b5563"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .text { font: 14px Arial, sans-serif; fill: #1f2937; }
      .small { font: 12px Arial, sans-serif; fill: #374151; }
      .group { fill: #fafafa; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #374151; stroke-width: 1.8; rx: 12; ry: 12; }
      .store { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; rx: 12; ry: 12; }
      .compute { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; rx: 12; ry: 12; }
      .result { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 12; ry: 12; }
      .line { stroke: #4b5563; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="560" class="bg"/>
  <text x="40" y="40" class="title">Zeppelin WDI Analytics Architecture</text>

  <rect x="40" y="90" width="230" height="90" class="box"/>
  <text x="155" y="126" text-anchor="middle" class="label">World Development Indicators</text>
  <text x="155" y="151" text-anchor="middle" class="text">Source files</text>

  <rect x="340" y="90" width="200" height="90" class="store"/>
  <text x="440" y="126" text-anchor="middle" class="label">Parquet Dataset</text>
  <text x="440" y="151" text-anchor="middle" class="text">wdi_csv_parquet</text>

  <line x1="270" y1="135" x2="340" y2="135" class="line"/>
  <rect x="276" y="108" width="78" height="18" fill="#ffffff"/>
  <text x="315" y="121" text-anchor="middle" class="small">load + convert</text>

  <rect x="160" y="230" width="700" height="260" rx="28" ry="28" class="group"/>
  <text x="185" y="260" class="label">Hadoop + Zeppelin Analytics Environment</text>

  <rect x="220" y="315" width="150" height="80" class="store"/>
  <text x="295" y="348" text-anchor="middle" class="label">HDFS / Storage</text>
  <text x="295" y="371" text-anchor="middle" class="text">Parquet files</text>

  <rect x="430" y="315" width="150" height="80" class="store"/>
  <text x="505" y="348" text-anchor="middle" class="label">Hive Metastore</text>
  <text x="505" y="371" text-anchor="middle" class="small">wdi_csv_parquet</text>

  <rect x="640" y="300" width="170" height="110" class="compute"/>
  <text x="725" y="335" text-anchor="middle" class="label">Zeppelin</text>
  <text x="725" y="360" text-anchor="middle" class="text">%sql / %spark.pyspark</text>
  <text x="725" y="384" text-anchor="middle" class="text">Spark Engine</text>

  <rect x="665" y="435" width="120" height="38" class="result"/>
  <text x="725" y="460" text-anchor="middle" class="label">GDP Outputs</text>

  <line x1="440" y1="180" x2="295" y2="315" class="line"/>
  <rect x="328" y="272" width="76" height="18" fill="#ffffff"/>
  <text x="366" y="285" text-anchor="middle" class="small">store data</text>

  <line x1="370" y1="355" x2="430" y2="355" class="line"/>
  <line x1="580" y1="355" x2="640" y2="355" class="line"/>
  <line x1="725" y1="410" x2="725" y2="435" class="line"/>
  <rect x="367" y="326" width="66" height="18" fill="#ffffff"/>
  <text x="400" y="339" text-anchor="middle" class="small">register</text>
  <rect x="582" y="326" width="56" height="18" fill="#ffffff"/>
  <text x="610" y="339" text-anchor="middle" class="small">query</text>
  <rect x="742" y="417" width="56" height="18" fill="#ffffff"/>
  <text x="770" y="430" text-anchor="middle" class="small">z.show()</text>
</svg>
